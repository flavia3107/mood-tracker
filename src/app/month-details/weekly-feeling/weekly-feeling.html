<div class="flex-row space-between middle">
	<div class="flex-row middle">
		<h3>Weekly Feeling</h3>
		<span>Aug 14-20</span>
	</div>
	<span>Week Avg: 6.8</span>
</div>
<div class="flex-row">
	<div class="flex-row days">
		@for(day of weekDays(); track $index){
		<div class="flex-column middle">
			@let background = day.color !== '#fff' ? day.color: '#f1f1f1';
			<span class="day-color" [style.backgroundColor]="background"></span>
			<span>{{day.date | date: 'EEEEE'}}</span>
		</div>
		}
	</div>
	<div class="chart-container">
		<div id="chart">
			<apx-chart [series]="chartOptions.series!" [chart]="chartOptions.chart!"
				[dataLabels]="chartOptions.dataLabels!" [stroke]="chartOptions.stroke!" [title]="chartOptions.title!"
				[subtitle]="chartOptions.subtitle!" [labels]="chartOptions.labels!" [xaxis]="chartOptions.xaxis!"
				[yaxis]="chartOptions.yaxis!"></apx-chart>
		</div>
	</div>
</div>
