<div class="flex-row space-between middle">
	<h3 class="section-title">Average Feeling</h3>
	<span class="pill">{{days()}} days</span>
</div>
<div class="flex-row main-container">
	<div class="chart-container average-value">
		<svg viewBox="0 0 200 200" style="width: 140px; height: 140px; object-fit: cover;">
			<g style="transform: scale(1.5); transform-origin: center;">
				<circle class="track-bg" cx="100" cy="100" [attr.r]="radius" />
				<circle class="track-fill" cx="100" cy="100" [attr.r]="radius" [attr.stroke-dasharray]="circumference"
					[attr.stroke-dashoffset]="strokeDashoffset()" />
			</g>
		</svg>

		<div class="chart-value">
			{{ monthlyAvg() }}
		</div>
	</div>
	<div class="description flex-column">
		<div class="details">
			<h4>Overall Average</h4>
			<span>
				Your average mood this month is positive
			</span>
		</div>
		<div class="chart-placeholders">
			<img class="placeholder" src="charts.png">
		</div>
	</div>
</div>
