<div class="flex-row space-between middle">
	<h3 class="section-title">Average Feeling</h3>
	<span class="pill" [style.backgroundColor]="pathColor()['background']">{{days()}} days</span>
</div>
<div class="flex-row main-container">
	<div class="chart-container average-value">
		<svg viewBox="0 0 200 200">
			<g style="transform: scale(1.5); transform-origin: center;">
				<circle class="track-bg" cx="100" cy="100" [attr.r]="radius" />
				<circle class="track-fill" [attr.stroke]="pathColor()['path']" cx="100" cy="100" [attr.r]="radius"
					[attr.stroke-dasharray]="circumference" [attr.stroke-dashoffset]="strokeDashoffset()" />
			</g>
		</svg>

		<div class="chart-value">
			{{ monthlyAvg().avg }}
		</div>
	</div>
	<div class="details">
		<h4 class="secondary-title">Overall Average</h4>
		<span class="message">
			{{ monthlyAvg().message }}
		</span>
	</div>
</div>
