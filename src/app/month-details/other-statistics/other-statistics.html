<div class="flex-row">
	<div class="flex-column section">
		<h3 class="section-title">Feeling Breakdown</h3>
		<div id="chart">
			@if (chartOptions()) {
			<apx-chart [series]="chartOptions().series!" [chart]="chartOptions().chart!"
				[labels]="chartOptions().labels!" [colors]="chartOptions().colors!"
				[responsive]="chartOptions().responsive!">
			</apx-chart>
			}
		</div>
	</div>
	<div class="flex-column col">
		<div class="flex-column section short-height">
			<h3 class="section-title">Recent Activity</h3>
			<p>Test</p>
		</div>
		<div class="flex-column section tall-height">
			@let quote = quote$ | async;
			<blockquote>
				<p>{{quote?.quote}}</p>
				<cite>{{quote?.author}}</cite>
			</blockquote>
		</div>
	</div>
	<div class="flex-column col">
		<div class="flex-column section height">
			<h3 class="section-title">Key Factors</h3>
			<div class="flex-row space-between">
				<p>a</p>
				<p>b</p>
				<p>c</p>
			</div>
		</div>
		<div class="flex-column section height">
			<h3 class="section-title">Journal Entry</h3>
			<p class="journal">{{journalSnippet ?? 'No entry yet'}}</p>
		</div>
	</div>
</div>
