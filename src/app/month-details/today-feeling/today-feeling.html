<div class="flex-row">
	<div class="flex-column">
		<h3>Today's Feeling</h3>
		<div class="gauge-container">
			<div class="svg-wrapper">
				<svg viewBox="0 0 100 65" width="100%" height="100%">
					<defs>
						<linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
							<stop offset="0%" stop-color="#4ade80" />
							<stop offset="40%" stop-color="#facc15" />
							<stop offset="75%" stop-color="#fb923c" />
							<stop offset="100%" stop-color="#f87171" />
						</linearGradient>
					</defs>

					<g transform="rotate(180 50 50)">
						<circle cx="50" cy="50" r="40" stroke="#e5e7eb" stroke-width="8" fill="transparent"
							stroke-dasharray="251.2" stroke-dashoffset="125.6" stroke-linecap="round" />

						<circle class="gauge-progress" cx="50" cy="50" r="40" stroke="url(#gaugeGradient)"
							stroke-width="8" fill="transparent" [attr.stroke-dasharray]="strokeDashArray"
							[attr.stroke-dashoffset]="strokeDashOffset" stroke-linecap="round" />
					</g>
				</svg>

				<div class="pointer-wrapper" [style.transform]="'rotate(' + pointerRotation + 'deg)'">
					<div class="arrow"></div>
				</div>
			</div>

			<div class="gauge-label">
				{{ value }}/10
			</div>
		</div>
		<h5>I'm feeling ....</h5>
		<h2>AWESOME</h2>
	</div>
</div>
