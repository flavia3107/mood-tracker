<h3>Today's Feeling</h3>
<div class="flex-row">
	<div class="flex-column middle">
		<div class="gauge-container">
			<div class="svg-wrapper">
				<svg viewBox="0 0 100 55" width="100%" height="100%">
					<defs>
						<linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
							<stop offset="0%" stop-color="#4ade80" />
							<stop offset="40%" stop-color="#facc15" />
							<stop offset="75%" stop-color="#fb923c" />
							<stop offset="100%" stop-color="#f87171" />
						</linearGradient>

						<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
							<feGaussianBlur stdDeviation="3.5" result="blur" />
							<feComposite in="SourceGraphic" in2="blur" operator="over" />
						</filter>
					</defs>

					<path class="gauge-glow-path" d="M 10,50 A 40,40 0 0,1 90,50" stroke-width="8" fill="transparent"
						filter="url(#glow)" opacity="0.65" stroke-linecap="round"
						[attr.stroke-dasharray]="strokeDashArray" [attr.stroke-dashoffset]="strokeDashOffset" />

					<path d="M 10,50 A 40,40 0 0,1 90,50" stroke="#e5e7eb" stroke-width="6" fill="transparent"
						stroke-linecap="round" />

					<path class="gauge-progress" d="M 10,50 A 40,40 0 0,1 90,50" stroke-width="6" fill="transparent"
						stroke-linecap="round" [attr.stroke-dasharray]="strokeDashArray"
						[attr.stroke-dashoffset]="strokeDashOffset" />
				</svg>

				<div class="pointer-wrapper" [style.transform]="'rotate(' + pointerRotation + 'deg)'">
					<div class="arrow"></div>
				</div>
			</div>

			<!-- <div class="gauge-label">
				{{ value }}/10
			</div> -->
		</div>
		<img class="mood-icon" [src]="todayMood().icon">
		<h5>I'm feeling ....</h5>
		<h2>AWESOME</h2>
	</div>
	<div class="flex-column right img-container">
		<img src="jump.png">
	</div>
</div>
