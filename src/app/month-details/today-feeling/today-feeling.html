<h3 class="section-title">Today's Feeling</h3>
<div class="flex-row">
	<div class="flex-column middle">
		<div class="gauge-container">
			<div class="svg-wrapper">
				<svg viewBox="0 0 100 55" width="100%" height="100%">
					<defs>
						<linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
							<stop offset="0%" [attr.stop-color]="colors()[5]" />
							<stop offset="40%" [attr.stop-color]="colors()[4]" />
							<stop offset="75%" [attr.stop-color]="colors()[2]" />
							<stop offset="100%" [attr.stop-color]="colors()[1]" />
						</linearGradient>

						<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
							<feGaussianBlur stdDeviation="2.5" result="blur" />
							<feComposite in="SourceGraphic" in2="blur" operator="over" />
						</filter>
					</defs>

					<path class="gauge-glow-path" d="M 10,50 A 40,40 0 0,1 90,50" stroke-width="6.5" fill="transparent"
						filter="url(#glow)" opacity="0.65" stroke-linecap="round"
						[attr.stroke-dasharray]="strokeDashArray"
						[attr.stroke-dashoffset]="svgConfig().strokeDashOffset" />

					<path d="M 10,50 A 40,40 0 0,1 90,50" stroke="#e5e7eb" stroke-width="6" fill="transparent"
						stroke-linecap="round" />

					<path class="gauge-progress" d="M 10,50 A 40,40 0 0,1 90,50" stroke-width="6" fill="transparent"
						stroke-linecap="round" [attr.stroke-dasharray]="strokeDashArray"
						[attr.stroke-dashoffset]="svgConfig().strokeDashOffset" />

					<g class="gauge-pointer" [style.transform]="'rotate(' + svgConfig().pointerRotation + 'deg)'">
						<polygon points="15,48 15,52 13,50" fill="#414141" />
					</g>
				</svg>
			</div>
		</div>
		<h5 class="secondary-title">I'm feeling </h5>
		<h2 class="secondary-title">{{todayMood().label}}</h2>
	</div>
	<div class="flex-column middle img-container">
		<img src="jump.png">
		<span class="secondary-title"> {{ time() | date:'hh:mm a' }}</span>
	</div>
</div>
