<div class="container flex-row" [ngClass]="currentMonth() | lowercase" [style.backgroundImage]="currentBackground()">
	<ng-container [ngTemplateOutlet]="activeTemplate()" [ngTemplateOutletContext]="{ $implicit: moodLogic }">
	</ng-container>
</div>

<ng-template #january let-m>
	<svg viewBox="50 0 200 200" xmlns="http://www.w3.org/2000/svg">
		<defs>
			<filter id="iceGlow">
				<feGaussianBlur stdDeviation="1.5" result="coloredBlur" />
				<feMerge>
					<feMergeNode in="coloredBlur" />
					<feMergeNode in="SourceGraphic" />
				</feMerge>
			</filter>
		</defs>
		@for (seed of m.days; track $index;) {
		@let transform=`translate(${seed.x},${seed.y}) rotate(${seed.rotation}) scale(${seed.scale})`;
		<g class="frost-unit" (click)="m.updateMood(seed)" [attr.transform]="transform" [matTooltip]="seed.tooltip"
			matTooltipClass="tooltip january" [class.today]="seed.isActiveDay">
			@for (angle of [0, 60, 120, 180, 240, 300]; track $index) {
			@let rotate = `rotate(${angle})`;
			<path [attr.transform]="rotate" d="M 0 0 L 8 -5 L 16 0 L 8 5 Z" [attr.fill]="seed.color" class="path" />
			<line x1="0" y1="0" x2="12" y2="0" [attr.transform]="'rotate(' + angle + ')'" class="line" />
			}
			<circle r="1.5" class="circle" />
			@let textRotate = `rotate(${-seed.rotation})`;
			<text x="0" dy="12" class="label" [attr.transform]="textRotate"> {{ seed.day}} </text>
		</g>
		}
	</svg>
	<div class="legend-container">
		<app-mood-picker (moodColorSelected)="m.getColor($event)" />
	</div>
</ng-template>
<ng-template #february let-m>
	<svg viewBox="-150 0 700 500" class="chocolate-svg svg">
		<defs>
			<clipPath id="heartClip">
				<path d="M50,100 C45,90 0,75 0,35 C0,10 25,0 50,25 C75,0 100,10 100,35 C100,75 55,90 50,100 Z" />
			</clipPath>

			<clipPath id="heartLidClip">
				<path
					d="M263,125 C330,5 520, 20 495,195 C480,305 295,435 280,465 C270,420 35,315 30,175 C25,25 200,10 260,120 Z" />
			</clipPath>

			<filter id="wrapperJitter" x="-20%" y="-20%" width="140%" height="140%">
				<feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" result="noise" />
				<feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
			</filter>
		</defs>
		<g class="heart-shape" clip-path="url(#heartLidClip)">
			<path class="heart-path"
				d="M263,125 C330,5 520, 20 495,195 C480,305 295,435 280,465 C270,420 35,315 30,175 C25,25 200,10 260,120 Z" />
			<path class="ribbon-p1" d="M175,385 L495,105" />
			<path class="ribbon-p2" d="M145,355 L475,70" />
			<path class="ribbon-p2" d="M215,405 L510,145" />

			<g class="ribbon-path">
				@for (leafIdx of [0, 1]; track leafIdx) {
				<g [attr.transform]="m.getLeafTransform(leafIdx)">
					<g clip-path="url(#heartClip)"> </g>
					<path class="ribbon-p3"
						d="M50,100 C45,90 0,75 0,35 C0,10 25,0 50,25 C75,0 100,10 100,35 C100,75 55,90 50,100 Z" />
				</g>
				}
			</g>
		</g>

		<g class="box-path">
			<path class="box-path-1" id="boxPath"
				d="M263,125 C330,5 520, 20 495,195 C480,305 295,435 280,465 C270,420 35,315 30,175 C25,25 200,10 260,120 Z" />
		</g>
		<g transform="translate(0, 0)">
			@for (c of m.days; track c.id) {
			@let rotate = `rotate(${c.rotate})`;
			<g class="chocolate" (click)="m.updateMood(c)" [attr.transform]="rotate" [class.today]="c.isActiveDay"
				[matTooltip]="c.tooltip" matTooltipClass="tooltip february">
				<path class="chocolate-path" [attr.d]="c.pts" filter="url(#wrapperJitter)" />
				<path class="chocolate-outer" [attr.d]="c.pts" [attr.fill]="c.color" />
				@let textFill = ['#FCF8E8', '#D4A373', '#fff'].includes(c.color) ? '#352522' : '#FCF8E8';
				<text [attr.x]="c.cx" [attr.y]="c.cy" class="day-label" [attr.fill]="textFill"> {{ c.id }} </text>
			</g>
			}
		</g>
	</svg>
	<div class="legend-container">
		<app-mood-picker (moodColorSelected)="m.getColor($event)" />
	</div>
</ng-template>
<ng-template #march let-m>
	<svg viewBox="0 0 200 200" class="clover-svg">
		<defs>
			<clipPath id="cloverClip">
				<path clip-rule="evenodd"
					d="M100,100 C95,90 50,75 50,35 C50,10 75,0 100,25 C125,0 150,10 150,35 C150,75 105,90 100,100 M100,100 C110,95 125,50 165,50 C190,50 200,75 175,100 C200,125 190,150 165,150 C125,150 110,105 100,100 M100,100 C105,110 150,125 150,165 C150,190 125,200 100,175 C75,200 50,190 50,165 C50,125 95,110 100,100 M100,100 C90,105 75,150 35,150 C10,150 0,125 25,100 C0,75 10,50 35,50 C75,50 90,95 100,100 Z" />
			</clipPath>
		</defs>

		<g transform="rotate(45, 100, 100)">
			<g class="shard-group" clip-path="url(#cloverClip)">
				@for(shard of m.days; track shard.day){
				<path [attr.d]="shard.path" (click)="m.updateMood(shard)" [attr.fill]="shard.color" class="shard"
					[class.today]="shard.isActiveDay" [matTooltip]="shard.tooltip" matTooltipClass="tooltip march" />
				<text [attr.x]="shard.x" [attr.y]="shard.y" class="label"> {{ shard.day }} </text>
				}
			</g>
			<path class="path"
				d="M100,100 C95,90 50,75 50,35 C50,10 75,0 100,25 C125,0 150,10 150,35 C150,75 105,90 100,100 M100,100 C110,95 125,50 165,50 C190,50 200,75 175,100 C200,125 190,150 165,150 C125,150 110,105 100,100 M100,100 C105,110 150,125 150,165 C150,190 125,200 100,175 C75,200 50,190 50,165 C50,125 95,110 100,100 M100,100 C90,105 75,150 35,150 C10,150 0,125 25,100 C0,75 10,50 35,50 C75,50 90,95 100,100 Z" />
		</g>
	</svg>
	<div class="legend-container">
		<app-mood-picker (moodColorSelected)="m.getColor($event)" />
	</div>
</ng-template>
<ng-template #april let-m>
	<svg viewBox="0 0 400 600" class="april-svg" xmlns="http://www.w3.org/2000/svg">
		<defs>
			<clipPath id="umbrella-mask">
				<path d="M180,70 C240,65 280,80 310,110 C340,140 375,190 375,275 Q340,285 300,300 
				L200,315 L100,300 Q60,285 25,275 C25,190 60,140 90,110 C120,80 160,65 220,70 Z" />
			</clipPath>
		</defs>
		<path class="handle-top" d="M200,280 L200,430" />
		<path class="handle-bottom" d="M200,435 Q200,500 155,465" />
		<g clip-path="url(#umbrella-mask)">
			@for (section of m.days; track $index) {
			<g (click)="m.updateMood(section)" class="shard-group" [class.today]="section.isActiveDay"
				matTooltipClass="tooltip april" [matTooltip]="section.tooltip">
				<path [attr.d]="section.path" [attr.fill]="section.color" />
				@let textTransform = `rotate(-80 ${section.coordinates.x} ${section.coordinates.y})`;
				<text class="umbrella-label" [attr.x]="section.coordinates.x" [attr.y]="section.coordinates.y"
					[attr.transform]="textTransform"> {{ section.dayNumber }} </text>
			</g>
			}
		</g>
		<path d="M180,70 C240,65 280,80 310,110 C340,140 375,190 375,275 Q340,285 300,300 
		L200,315 L100,300 Q60,285 25,275 C25,190 60,140 90,110 C120,80 160,65 220,70 Z" class="path" />
	</svg>
	<div class="legend-container">
		<app-mood-picker (moodColorSelected)="m.getColor($event)" />
	</div>
</ng-template>
<ng-template #may let-m>
	<svg viewBox="0 0 800 368" xmlns="http://www.w3.org/2000/svg">
		<defs>
			<path id="petalShape" d="M 0 0 C -11 -7, -7 -15, 0 -12 C 7 -15, 11 -7, 0 0" />
			<symbol id="dayFlower" viewBox="-15 -15 30 30">
				<use href="#petalShape" fill="currentColor" stroke="inherit" stroke-width="0.3" transform="rotate(0)" />
				<use href="#petalShape" fill="currentColor" stroke="inherit" stroke-width="0.3"
					transform="rotate(72)" />
				<use href="#petalShape" fill="currentColor" stroke="inherit" stroke-width="0.3"
					transform="rotate(144)" />
				<use href="#petalShape" fill="currentColor" stroke="inherit" stroke-width="0.3"
					transform="rotate(216)" />
				<use href="#petalShape" fill="currentColor" stroke="inherit" stroke-width="0.3"
					transform="rotate(288)" />
				<circle r="2" fill="#FAD4E1" />
			</symbol>
		</defs>
		<rect width="100%" height="100%" fill="url(#dotGrid)" />
		@for (f of m.days; track f.day) {
		@let transform = `translate(${f.x}, ${f.y}) scale(${f.scale})`;
		<g [attr.transform]="transform" (click)="m.updateMood(f)" class="flower" matTooltipClass="tooltip may"
			[matTooltip]="f.tooltip" [class.today]="f.isActiveDay">
			<g [attr.transform]="'rotate(' + f.rotation + ')'">
				@let stroke = ['#F36D9B', '#D94773', '#eea2bc'].includes(f.color) ? '#f4cfdf' : '#F06292';
				<use href="#dayFlower" [attr.color]="f.color" [attr.stroke]="stroke" width="30" height="30" x="-15"
					y="-15" />
				@let color = ['#F36D9B', '#D94773', '#eea2bc'].includes(f.color) ? '#FEEEF0' : '#5D4037';
				@let transform_text = `rotate(${-f.rotation}) translate(3, -6)`;
				<g [attr.transform]="transform_text">
					<text x="0" y="0" dy=".3em" [attr.fill]="color" class="label"> {{ f.day }} </text>
				</g>
			</g>
		</g>
		}
	</svg>
	<div class="legend-container">
		<app-mood-picker (moodColorSelected)="m.getColor($event)" />
	</div>
</ng-template>
<ng-template #june let-m>
	<div class="legend-container">
		<app-mood-picker (moodColorSelected)="m.getColor($event)" />
	</div>
	<svg viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg">
		<defs>
			<clipPath id="wedgeClip">
				<path [attr.d]="june_config.wedgePath" />
			</clipPath>
		</defs>
		<path class="watermelon-path" [attr.d]="june_config.wedgePath" />
		<g class="segments" clip-path="url(#wedgeClip)">
			@for (seg of m.days; track seg.id) {
			<path [attr.d]="seg.d" [attr.fill]="seg['color']" [matTooltip]="seg.tooltip" (click)="m.updateMood(seg)"
				matTooltipClass="tooltip june" class="clickable-segment" [class.today]="seg.isActiveDay" />
			<text class="label" [attr.x]="seg.x" [attr.y]="seg.y"> {{ seg.id }} </text>
			}
		</g>
		<g clip-path="url(#wedgeClip)">
			<path class="outer-path" [attr.d]="june_config.rindPathBase" />
			<path class="outer-path-1" [attr.d]="june_config.rindPathMid" />
			<path class="outer-path-2" [attr.d]="june_config.rindPathOuter" />
		</g>
	</svg>
</ng-template>
<ng-template #july let-m>
	<svg viewBox="0 0 400 450">
		<defs>
			<path id="hex-shape" d="M25 0 L50 14.42 V43.25 L25 57.67 L0 43.25 V14.42 Z" />
		</defs>
		<g transform="translate(50, 50)">
			@for (day of m.days; track $index) {
			<use href="#hex-shape" [attr.x]="day.x" [attr.y]="day.y" [style.fill]="day.color" [matTooltip]="day.tooltip"
				matTooltipClass="tooltip july" (click)="m.updateMood(day)" class="comb"
				[class.today]="day.isActiveDay" />
			@let color = day.color === '#4E342E' || day.color === '#8D6E63' ? '#FFF5F6' : '#3E2723';
			<text [attr.x]="day.x + 17" [attr.y]="day.y + 35" [attr.fill]="color" class="label"> {{ day.day }} </text>
			}
		</g>
	</svg>
	<div class="legend-container">
		<app-mood-picker (moodColorSelected)="m.getColor($event)" />
	</div>
</ng-template>
<ng-template #august let-m>
	<svg viewBox="0 0 250 250" class="sunflower">
		<defs>
			<mask id="petalMask">
				<path d="M125 105 C135 80, 140 40, 125 30 C110 40, 115 80, 125 105 Z" fill="white" />
			</mask>
		</defs>

		@for (day of m.days; track day.label) {
		<g [attr.transform]="day.groupTransform" (click)="m.updateMood(day)" [class.today]="day.isActiveDay"
			[matTooltip]="day.tooltip" matTooltipClass="tooltip august">
			<path d="M125 105 C135 80, 140 40, 125 30 C110 40, 115 80, 125 105 Z" [attr.fill]="day.color"
				[attr.stroke]="day.stroke" stroke-width="0.7" />
			<g mask="url(#petalMask)" opacity="0.1" [attr.fill]="day.stroke">
				<path d="M125 105 C132 85, 130 50, 125 45 C120 50, 118 85, 125 105 Z" />
			</g>
			<text x="125" y="48" class="label" [attr.transform]="day.textTransform"> {{ day.dayNumber }} </text>
		</g>
		}
		<circle cx="125" cy="125" r="40" fill="#3E2723" />
		<circle cx="125" cy="125" r="35" class="circle-2" />
		<circle cx="125" cy="125" r="32" class="circle-3" />
	</svg>
	<div class="legend-container">
		<app-mood-picker (moodColorSelected)="m.getColor($event)" />
	</div>
</ng-template>
<ng-template #september let-m>
	<div class="legend-container">
		<app-mood-picker (moodColorSelected)="m.getColor($event)" />
	</div>
	<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
		<g class="leaves-group">
			@for (leaf of m.days; track leaf.day) {
			@let transform = `translate(${leaf.x}, ${leaf.y}) rotate(${leaf.rotate}) scale(${leaf.scale})`;
			<g [attr.transform]="transform" (click)="m.updateMood(leaf)" class="leaf-container"
				[class.today]="leaf.isActiveDay" [matTooltip]="leaf.tooltip" matTooltipClass="tooltip september">
				<path [attr.d]="leaf.d" [attr.fill]="leaf.color" class="leaf-path" />
				<line x1="20" y1="2" x2="20" y2="48" class="line" />
				<line x1="20" y1="0" x2="20" y2="-8" class="line line-2" />
				@let text = ['#D4E157','#9fc03b','#70a240', '#fff'].includes(leaf.color) ? '#151d12' : '#fff';
				<text x="10" y="20" [attr.fill]="text" class="leaf-label"> {{ leaf.day }} </text>
			</g>
			}
		</g>
	</svg>
</ng-template>
<ng-template #october let-m>
	<svg viewBox="0 0 500 450" class="pumpkin-svg">
		<defs>
			<mask id="pumpkinMask">
				<path d="M250,100 C320,100 390,120 420,195 C450,290 400,410 300,410 
						 L200,410 C100,410 50,290 80,195 C110,120 180,100 250,100 Z" fill="white" />
			</mask>
		</defs>
		<path class="stub" d="M230,80 Q250,20 270,80 L260,95 H240 Z" />
		<g mask="url(#pumpkinMask)">
			<rect width="500" height="450" fill="#FBF8F4" />
			@for (day of m.days; track $index) {
			<g (click)="m.updateMood(day)" style="cursor: pointer;" [class.today]="day.isActiveDay"
				[matTooltip]="day.tooltip" matTooltipClass="tooltip october">
				<polygon [attr.points]="day.points" [attr.fill]="day.color" stroke="#3e2723" stroke-width="1" />
				@let textFill = ['#C04B0D', '#CA651D'].includes(day.color) ?'#FCF8E8':'#3c2a21' ;
				<text [attr.x]="day.centerX" [attr.y]="day.centerY" class="label" [attr.fill]="textFill">
					{{ day.day }}
				</text>
			</g>
			}
		</g>
		<path
			d="M250,100 C320,100 390,120 420,195 C450,290 400,410 300,410 L200,410 C100,410 50,290 80,195 C110,120 180,100 250,100 Z"
			class="path" />

		<g class="face-overlay" style="pointer-events: none;">
			<path d="M160,190 L210,240 H140 Z" fill="#1a1a1a" />
			<path d="M340,190 L290,240 H360 Z" fill="#1a1a1a" />
			<path
				d="M150,290 C180,340 320,340 350,290 L310,290 L310,310 L280,310 L280,290 L220,290 L220,310 L190,310 L190,290 Z"
				fill="#1a1a1a" />
		</g>
	</svg>
	<div class="legend-container">
		<app-mood-picker (moodColorSelected)="m.getColor($event)" />
	</div>
</ng-template>
<ng-template #november let-m>
	<svg viewBox="0 0 400 550" width="100%" height="100%">
		<defs>
			<path id="textCurvePath"
				d="M 110,430 C 110,350 50,300 50,180 C 50,50 350,50 350,180 C 350,300 290,350 290,430" />
			<clipPath id="scarfShapeMask">
				<use xlink:href="#textCurvePath" stroke="white" stroke-width="45" fill="none" />
			</clipPath>
			<linearGradient id="scarfShadow" x1="0%" y1="0%" x2="0%" y2="100%">
				<stop offset="0%" stop-color="#3c2a21" stop-opacity="0" />
				<stop offset="50%" stop-color="#3c2a21" stop-opacity="0.1" />
				<stop offset="100%" stop-color="#3c2a21" stop-opacity="0" />
			</linearGradient>
		</defs>
		<use xlink:href="#textCurvePath" class="text-curve" />
		<use xlink:href="#textCurvePath" class="text-curve txt" />

		@for (day of m.days; track day) {
		@let dasharray = `${m.november.segmentLength} ${(m.november.totalPathLength - m.november.segmentLength)}`;
		@let dashoffset = -((day.date - 1) * (m.november.totalPathLength / 30));
		<g [matTooltip]="day.tooltip" matTooltipClass="tooltip november">
			<use class="scarf-part" xlink:href="#textCurvePath" [attr.stroke]="day.color"
				[attr.stroke-dasharray]="dasharray" [attr.stroke-dashoffset]="dashoffset" (click)="m.updateMood(day)"
				[class.today]="day.isActiveDay" />
			@let textFill = ['#ead6ca', '#ddb892', '#b08968', '#fff'].includes(day.color) ? '#3c2a21' : '#FCF8E8';
			@let startOffset = ((day.date - 1) * (m.november.totalPathLength / 30)) + (m.november.segmentLength / 2);
			<text class="label">
				<textPath xlink:href="#textCurvePath" [attr.fill]="textFill" [attr.startOffset]="startOffset">
					{{day.date}}
				</textPath>
			</text>
		</g>
		}
		<g transform="translate(110, 430)">
			<path d="M -24,0 C -28,10 -21,20 -25,30" />
			<path d="M -20,0 C -24,10 -17,20 -21,30" />
			<path d="M -16,0 C -20,10 -13,20 -17,30" />
			<path d="M -12,0 C -16,10 -9,20  -13,30" />
			<path d="M -8,0  C -12,10 -5,20  -9,30" />
			<path d="M -4,0  C -8,10  -1,20  -5,30" />
			<path d="M 0,0   C -4,10  4,20   0,30" />
			<path d="M 4,0   C 0,10   8,20   4,30" />
			<path d="M 8,0   C 4,10   12,20  8,30" />
			<path d="M 12,0  C 8,10   16,20  12,30" />
			<path d="M 16,0  C 12,10  20,20  16,30" />
			<path d="M 20,0  C 16,10  24,20  20,30" />
			<path d="M 24,0  C 20,10  28,20  24,30" />
		</g>

		<g transform="translate(290, 430)">
			<path d="M -24,0 C -28,10 -21,20 -25,30" />
			<path d="M -20,0 C -24,10 -17,20 -21,30" />
			<path d="M -16,0 C -20,10 -13,20 -17,30" />
			<path d="M -12,0 C -16,10 -9,20  -13,30" />
			<path d="M -8,0  C -12,10 -5,20  -9,30" />
			<path d="M -4,0  C -8,10  -1,20  -5,30" />
			<path d="M 0,0   C -4,10  4,20   0,30" />
			<path d="M 4,0   C 0,10   8,20   4,30" />
			<path d="M 8,0   C 4,10   12,20  8,30" />
			<path d="M 12,0  C 8,10   16,20  12,30" />
			<path d="M 16,0  C 12,10  20,20  16,30" />
			<path d="M 20,0  C 16,10  24,20  20,30" />
			<path d="M 24,0  C 20,10  28,20  24,30" />
		</g>
	</svg>

	<div class="legend-container">
		<app-mood-picker (moodColorSelected)="m.getColor($event)" />
	</div>
</ng-template>
<ng-template #december let-m>
	<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
		@for (d of m.days; track $index;) {
		@let transform = `translate(${d.x}, ${d.y})`;
		<g class="bulb" [class.brightness]="d.color !== '#fff'" [attr.transform]="transform" [matTooltip]="d.tooltip"
			matTooltipClass="tooltip december" (click)="m.updateMood(d)" [class.today]="d.isActiveDay">
			<circle cx="0" cy="0" r="5" [attr.fill]="d.color" />
			<rect x="-1" y="-6.2" width="2" height="2" fill="#333" />
			<text class="label" [class.lightText]="['#840627', '#af142e', '#e0464f'].includes(d.color)" x="0" y="0"
				dy=".35em">
				{{d.day}}
			</text>
		</g>
		}
	</svg>
	<div class="legend-container">
		<app-mood-picker (moodColorSelected)="m.getColor($event)" />
	</div>
</ng-template>
