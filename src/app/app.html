<div class="main-container flex-row">
  <div class="calendar flex-column center">
    <div class="flex-row header space-between middle">
      <a href="https://all-projects-portfolio.web.app/" target="_blank">
        <img src="logo.svg" />
      </a>
      <button mat-icon-button (click)="navigate()">
        <mat-icon> {{activeRoute() === '/'? 'insights': 'brightness_5'}} </mat-icon>
      </button>
    </div>
    <app-calendar />
    <mat-icon
      matTooltip="• Current month is live.&#10;• Past months are randomized.&#10;• Data is stored locally on this device, it won't sync if you switch devices."
      matTooltipClass="multiline-tooltip" class="info">help_outline</mat-icon>
  </div>
  <div class="month-view flex-column center middle" [style.background-image]="background()">
    <router-outlet></router-outlet>
  </div>
</div>
